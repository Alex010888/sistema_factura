<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9C9"/>
      <stop offset="0.5" stop-color="#F7D8A4"/>
      <stop offset="1" stop-color="#EAB57A"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
