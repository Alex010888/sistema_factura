{% set current = request.endpoint if request else '' %}
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
      <img src="{{ url_for('static', filename='img/bakery-logo.svg') }}" alt="Panadería" width="34" height="34">
      <span class="brand-name">Panadería Dulce Vida</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {{ 'active' if current == 'clientes_listar' else '' }}" href="{{ url_for('clientes_listar') }}">Clientes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if current == 'productos_listar' else '' }}" href="{{ url_for('productos_listar') }}">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if current in ['ventas', 'ventas_nueva', 'ventas_detalle'] else '' }}" href="{{ url_for('ventas') }}">Ventas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if current == 'ventas_listar' else '' }}" href="{{ url_for('ventas_listar') }}">Venta rápida</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {{ 'active' if current == 'reportes' else '' }}" href="{{ url_for('reportes') }}">Reportes</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="navbar-text app-user">Hola, {{ user.username }}</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Salir</a>
      </div>
    </div>
  </div>
</nav>
